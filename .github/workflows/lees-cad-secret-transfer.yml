name: 迁移 CAD 镜像凭据密文
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: python3 -m pip install pynacl==1.6.2
      - name: 只输出目标仓公钥加密的密文
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          from nacl.public import PublicKey, SealedBox
          values = {name: os.environ[name].strip() for name in ('CF_API_TOKEN','TENCENT_COS_SECRET_ID','TENCENT_COS_SECRET_KEY','TENCENT_COS_BUCKET','TENCENT_COS_REGION')}
          if not all(values.values()): raise SystemExit('Required source credential missing')
          # Transfer existing Secrets only; do not issue cloud upload or token-inspection requests.
          account=os.environ.get('CF_ACCOUNT_ID','').strip()
          if account: values['CF_ACCOUNT_ID']=account
          values['R2_BUCKET']='packing-list-releases'
          box=SealedBox(PublicKey(base64.b64decode('LNu6hJHsUGl0s/Uh6NOn0/pgE9m19usdo81l4ijHE1w=')))
          result={'repository':'lyq2010/lees-cad-releases','keyId':'3380204578043523366','secrets':{name:base64.b64encode(box.encrypt(value.encode())).decode() for name,value in values.items()}}
          with open('sealed-secrets.json','x') as stream: json.dump(result,stream)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lees-cad-sealed-mirror-secrets
          path: sealed-secrets.json
          retention-days: 1
          if-no-files-found: error
