name: Temporary Lee's Music secrets transfer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - run: python3 -m pip install pynacl
      - name: Encrypt only the five music mirror secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          names = ['CF_API_TOKEN', 'TENCENT_COS_BUCKET', 'TENCENT_COS_REGION', 'TENCENT_COS_SECRET_ID', 'TENCENT_COS_SECRET_KEY']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing source secret names: ' + ', '.join(missing))
          box = SealedBox(PublicKey(base64.b64decode('8Z1eAchU8tFlY3NMvCUOCYFh9cCCAbmGG6JkBpCBpSQ=')))
          payload = {name: {'key_id': '3380204578043523366', 'encrypted_value': base64.b64encode(box.encrypt(os.environ[name].encode())).decode()} for name in names}
          Path('encrypted').mkdir()
          Path('encrypted/music-secrets.json').write_text(json.dumps(payload))
          print('Encrypted five named secrets for lyq2010/lees-music; no plaintext exported.')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: lees-music-secrets-transfer
          path: encrypted/music-secrets.json
          retention-days: 1
          if-no-files-found: error
