name: Lee's PDF Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 私有源码 Tag（例如 v1.0.0）
        required: true
        type: string
      platform:
        description: 构建平台；单端重试复用同一 Draft 已核对的另一端资产
        type: choice
        default: all
        options: [all, windows-x86_64, darwin-aarch64]
      promote:
        description: 公布已验收 Draft；重新核对并补齐双源后晋升更新指针
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lees-pdf-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - id: version
        env:
          SOURCE_TAG: ${{ inputs.tag }}
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import os,re,json
          tag=os.environ['SOURCE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)',tag):
              raise SystemExit('源码 Tag 格式无效')
          platform=os.environ.get('BUILD_PLATFORM') or 'all'
          rows=[{'target':'windows-x86_64','runner':'windows-2025'}, {'target':'darwin-aarch64','runner':'macos-26'}]
          if platform not in ('all','windows-x86_64','darwin-aarch64'):
              raise SystemExit('构建平台无效')
          if platform != 'all':
              rows=[row for row in rows if row['target']==platform]
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'version={tag[1:]}\ntag=lees-pdf-{tag}\n')
              output.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          PY
  prepare-draft:
    if: ${{ !inputs.promote }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 准备公开资产暂存 Draft
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$PUBLIC_TAG" --repo lyq2010/lee-releases --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$PUBLIC_TAG" --repo lyq2010/lee-releases --json isDraft --jq .isDraft)" = true
          else
            gh release create "$PUBLIC_TAG" --repo lyq2010/lee-releases --target main --draft --latest=false --title "Lee’s PDF $RELEASE_VERSION" --notes "双平台发行资产准备中；尚未公布。"
          fi
  build:
    if: ${{ !inputs.promote }}
    needs: [validate, prepare-draft]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 210
    environment: lees-pdf-release
    env:
      PYTHONUTF8: '1'
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: release-repo
          persist-credentials: false
      - name: 创建 PDF 私有源码与固定 SDK 只读令牌
        id: source
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: lyq2010
          repositories: lees-pdf
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: lyq2010/lees-pdf
          ref: ${{ inputs.tag }}
          path: private-source
          token: ${{ steps.source.outputs.token }}
          persist-credentials: false
          fetch-depth: 0
      - name: 配置 Windows 一次性原生构建目录
        if: ${{ matrix.target == 'windows-x86_64' }}
        shell: pwsh
        env:
          SOURCE_TAG: ${{ inputs.tag }}
        run: |
          if($env:SOURCE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'){throw '源码Tag格式无效'}
          if(Test-Path 'I:\'){throw 'runner已有I盘，不改写既有盘符'}
          $root=Join-Path $env:RUNNER_TEMP 'lees-pdf-native'
          $null=New-Item -ItemType Directory -Path $root
          subst I: $root
          if($LASTEXITCODE){throw '一次性缓存盘配置失败'}
          $null=New-Item -ItemType Directory -Force -Path I:/DevCache/Temp,I:/DevCache/cargo,I:/DevCache/tools
          if(Test-Path private-source/.tools){throw '源码检出含未知依赖目录'}
          $null=New-Item -ItemType Junction -Path private-source/.tools -Target I:/DevCache/tools
          "CARGO_HOME=I:/DevCache/cargo" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$($env:SOURCE_TAG.Substring(1))" >> $env:GITHUB_ENV
      - name: 配置 macOS 原生构建环境
        if: ${{ matrix.target == 'darwin-aarch64' }}
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${SOURCE_TAG#v}" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/lees-pdf-public-cargo" >> "$GITHUB_ENV"
          test -d /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup default stable
          rustup target add aarch64-apple-darwin
          brew list cmake >/dev/null 2>&1 || brew install cmake
          cmake --version
          cargo --version
      - uses: actions/cache/restore@v5
        id: cargo-cache
        with:
          path: ${{ env.CARGO_HOME }}/registry/cache/index.crates.io-*/*.crate
          key: lees-pdf-native-crates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('private-source/Cargo.lock') }}
          restore-keys: |
            lees-pdf-native-crates-${{ runner.os }}-${{ runner.arch }}-
      - name: 从已发布包补齐固定 ONNX Runtime 输入
        if: ${{ inputs.tag == 'v1.0.1' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $scratch=Join-Path $env:RUNNER_TEMP 'lees-pdf-onnx-recovery'
          if($IsWindows){
            $env:TEMP='I:/DevCache/Temp';$env:TMP=$env:TEMP
            $scratch='I:/DevCache/lees-pdf-onnx-recovery'
            $seven=Join-Path $env:ProgramFiles '7-Zip/7z.exe'
            python release-repo/release-tools/lees-pdf/restore_onnx_input.py --source private-source --tools 'I:/DevCache/tools' --target $env:RELEASE_TARGET --scratch $scratch --seven-zip $seven
          }else{
            $tools=Join-Path $env:RUNNER_TEMP 'lees-pdf-native-macos/tools'
            python3 release-repo/release-tools/lees-pdf/restore_onnx_input.py --source private-source --tools $tools --target $env:RELEASE_TARGET --scratch $scratch
          }
          if($LASTEXITCODE){throw '固定 ONNX Runtime 输入恢复失败'}
      - name: 构建与核对最终包（私有诊断留在隔离 runner）
        shell: pwsh
        env:
          SOURCE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ steps.source.outputs.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
          LEESPDF_COS_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
          LEES_UPDATER_PRIVATE_KEY: ${{ secrets.LEESPDF_UPDATER_PRIVATE_KEY }}
          LEES_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.LEESPDF_UPDATER_PRIVATE_KEY_PASSWORD }}
          LEESPDF_WINDOWS_PFX: ${{ secrets.LEESPDF_WINDOWS_PFX_BASE64 }}
          LEESPDF_WINDOWS_PFX_PASSWORD: ${{ secrets.LEESPDF_WINDOWS_PFX_PASSWORD }}
        run: |
          if($IsWindows){
            $env:TEMP='I:/DevCache/Temp';$env:TMP=$env:TEMP
            $env:PYTHONPYCACHEPREFIX='I:/DevCache/python-pycache'
          }
          $python=if($IsWindows){'python'}else{'python3'}
          $diagnostics=if($IsWindows){'I:/DevCache/lees-pdf-private-build.log'}else{Join-Path $env:RUNNER_TEMP 'lees-pdf-private-build.log'}
          & $python release-repo/release-tools/lees-pdf/logged_build.py --log $diagnostics --phase preflight -- pwsh -NoProfile -NonInteractive -File release-repo/release-tools/lees-pdf/build.ps1 -SourceRoot private-source -OutputRoot public-output
          if($LASTEXITCODE){throw '原生发行构建失败；私有诊断仅保留在 runner'}
      - name: 保留公开依赖归档（失败构建也可复用）
        if: ${{ always() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CARGO_HOME }}/registry/cache/index.crates.io-*/*.crate
          key: lees-pdf-native-crates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('private-source/Cargo.lock') }}
      - name: 将公开构建资产上传同一 Draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $assets=@(Get-ChildItem public-output -File | ForEach-Object FullName)
          if(!$assets.Count){throw '公开构建资产缺失'}
          gh release upload $env:PUBLIC_TAG @assets --repo lyq2010/lee-releases --clobber
          if($LASTEXITCODE){throw 'Draft 上传失败'}
  draft:
    if: ${{ !inputs.promote }}
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: lees-pdf-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 一次读取双端 Draft 资产
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release download "$PUBLIC_TAG" --repo lyq2010/lee-releases --dir public-output
      - name: 核对双端身份并签名发行清单
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
          LEESPDF_RELEASE_PRIVATE_KEY: ${{ secrets.LEESPDF_RELEASE_PRIVATE_KEY }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
        run: node release-tools/lees-pdf/manifest.mjs public-output
      - name: 安装固定镜像依赖
        run: |
          python3 -m pip install cos-python-sdk-v5==1.9.38
          npm install --prefix "$RUNNER_TEMP/lees-pdf-mirror-tools" --no-audit --no-fund --ignore-scripts wrangler@4.151.0
          echo "LEESPDF_WRANGLER_CLI=$RUNNER_TEMP/lees-pdf-mirror-tools/node_modules/wrangler/bin/wrangler.js" >> "$GITHUB_ENV"
      - name: 复用本地资产并行上传双源并核对 HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          R2_BUCKET: packing-list-releases
        run: python3 release-tools/lees-pdf/stage_mirrors.py public-output
  promote:
    if: ${{ always() && inputs.promote && needs.validate.result == 'success' && needs.draft.result == 'skipped' }}
    needs: [validate, draft]
    runs-on: ubuntu-latest
    environment: lees-pdf-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 读取同一 Draft
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release download "$PUBLIC_TAG" --repo lyq2010/lee-releases --dir public-output
      - run: python3 -m pip install cos-python-sdk-v5==1.9.38
      - name: 一次安装固定版本 R2 上传工具
        run: |
          npm install --prefix "$RUNNER_TEMP/lees-pdf-mirror-tools" --no-audit --no-fund --ignore-scripts wrangler@4.151.0
          echo "LEESPDF_WRANGLER_CLI=$RUNNER_TEMP/lees-pdf-mirror-tools/node_modules/wrangler/bin/wrangler.js" >> "$GITHUB_ENV"
      - name: 核对双源 HEAD 元数据并更新发行指针
        env:
          RETRY_MIRRORS: ${{ inputs.promote }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          R2_BUCKET: packing-list-releases
        run: |
          if [[ "$RETRY_MIRRORS" == true ]]; then
            MIRROR=cos python3 release-tools/lees-pdf/mirror.py stage public-output
            MIRROR=r2 python3 release-tools/lees-pdf/mirror.py stage public-output
          fi
          python3 release-tools/lees-pdf/mirror.py release-retain-previous public-output
      - name: 清除 Draft 装配暂存
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          tag=os.environ['PUBLIC_TAG']
          release=json.loads(subprocess.check_output(['gh','release','view',tag,'--repo','lyq2010/lee-releases','--json','assets'],text=True))
          temporary={'darwin-aarch64.json','windows-x86_64.json','darwin-aarch64-public-config.json','windows-x86_64-public-config.json','readiness-cos.json','readiness-r2.json','lees-pdf-build-status-windows-x86_64.json','SHA256SUMS'}
          for asset in release['assets']:
              name=asset['name']
              if name in temporary or (name.startswith('lees-pdf-diagnostics-') and name.endswith('.json')):
                  subprocess.run(['gh','release','delete-asset',tag,name,'--repo','lyq2010/lee-releases','--yes'],check=True)
          PY
      - name: 公布发行
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release edit "$PUBLIC_TAG" --repo lyq2010/lee-releases --draft=false --latest=false
