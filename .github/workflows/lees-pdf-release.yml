name: Lee's PDF Native Windows Candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已验收的原生源码 Tag（vX.Y.Z）；仅构建候选，不发布
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: lees-pdf-native-windows
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    environment: lees-pdf-release
    env:
      RELEASE_TARGET: windows-x86_64
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          path: release-repo
          persist-credentials: false
      - name: 创建PDF私有源码与固定SDK只读令牌
        id: source
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: lyq2010
          repositories: lees-pdf
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: lyq2010/lees-pdf
          ref: ${{ inputs.tag }}
          path: private-source
          token: ${{ steps.source.outputs.token }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 配置一次性原生构建目录
        shell: pwsh
        env:
          SOURCE_TAG: ${{ inputs.tag }}
        run: |
          if($env:SOURCE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'){throw '源码Tag格式无效'}
          if(Test-Path 'I:\'){throw 'runner已有I盘，不改写既有盘符'}
          $root=Join-Path $env:RUNNER_TEMP 'lees-pdf-native'
          $null=New-Item -ItemType Directory -Path $root
          subst I: $root
          if($LASTEXITCODE){throw '一次性缓存盘配置失败'}
          $null=New-Item -ItemType Directory -Force -Path I:/DevCache/Temp,I:/DevCache/cargo,I:/DevCache/tools
          if(Test-Path private-source/.tools){throw '源码检出含未知依赖目录'}
          $null=New-Item -ItemType Junction -Path private-source/.tools -Target I:/DevCache/tools
          "CARGO_HOME=I:/DevCache/cargo" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$($env:SOURCE_TAG.Substring(1))" >> $env:GITHUB_ENV
      # Only public crate archives are cached, never private build output or diagnostics.
      - uses: actions/cache@v5
        with:
          path: I:/DevCache/cargo/registry/cache/index.crates.io-*/*.crate
          key: lees-pdf-native-crates-${{ runner.os }}-${{ hashFiles('private-source/Cargo.lock') }}
      - name: 构建签名原生候选（私有诊断不上传）
        shell: pwsh
        env:
          SOURCE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ steps.source.outputs.token }}
          LEESPDF_WINDOWS_PFX: ${{ secrets.LEESPDF_WINDOWS_PFX_BASE64 }}
          LEESPDF_WINDOWS_PFX_PASSWORD: ${{ secrets.LEESPDF_WINDOWS_PFX_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.LEESPDF_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.LEESPDF_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: '& release-repo/release-tools/lees-pdf/build.ps1 -SourceRoot private-source -OutputRoot public-output'
      - name: 保留核对后的公开候选材料
        uses: actions/upload-artifact@v6
        with:
          name: lees-pdf-native-windows-${{ env.RELEASE_VERSION }}
          path: public-output/*
          if-no-files-found: error
          retention-days: 7
      # Product publication remains gated by final package, macOS and device acceptance.
