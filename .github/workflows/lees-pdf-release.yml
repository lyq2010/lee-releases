name: Lee's PDF Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 私有源码 Tag（例如 v1.0.0）
        required: true
        type: string
      platform:
        description: 构建平台；单端重试复用同一 Draft 已核对的另一端资产
        type: choice
        default: all
        options: [all, windows-x86_64, darwin-aarch64]
      promote:
        description: 仅重试已有 Draft 晋升；正常构建完成后会在同一轮直接发布
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lees-pdf-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - id: version
        env:
          SOURCE_TAG: ${{ inputs.tag }}
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import os,re,json
          tag=os.environ['SOURCE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)',tag):
              raise SystemExit('源码 Tag 格式无效')
          platform=os.environ.get('BUILD_PLATFORM') or 'all'
          rows=[{'target':'windows-x86_64','runner':'windows-2025'}, {'target':'darwin-aarch64','runner':'macos-26'}]
          if platform not in ('all','windows-x86_64','darwin-aarch64'):
              raise SystemExit('构建平台无效')
          if platform != 'all':
              rows=[row for row in rows if row['target']==platform]
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'version={tag[1:]}\ntag=lees-pdf-{tag}\n')
              output.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          PY
  prepare-draft:
    if: ${{ !inputs.promote }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 准备公开资产暂存 Draft
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$PUBLIC_TAG" --repo lyq2010/lee-releases --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$PUBLIC_TAG" --repo lyq2010/lee-releases --json isDraft --jq .isDraft)" = true
          else
            gh release create "$PUBLIC_TAG" --repo lyq2010/lee-releases --target main --draft --latest=false --title "Lee’s PDF $RELEASE_VERSION" --notes "双平台发行资产准备中；尚未公布。"
          fi
  build:
    if: ${{ !inputs.promote }}
    needs: [validate, prepare-draft]
    permissions:
      contents: write
    # 一次性 GitHub 托管 runner；私有源码和诊断不进入公开缓存或资产。
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    environment: lees-pdf-release
    steps:
      - uses: actions/checkout@v7
        with:
          path: release-repo
          persist-credentials: false
      - name: 创建仅限 PDF 私有仓的只读令牌
        id: source
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: lyq2010
          repositories: lees-pdf
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: lyq2010/lees-pdf
          ref: ${{ inputs.tag }}
          path: private-source
          token: ${{ steps.source.outputs.token }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 配置公开 Cargo 依赖下载目录
        shell: pwsh
        run: |
          "CARGO_HOME=$([IO.Path]::Combine($env:RUNNER_TEMP,'lees-pdf-public-cargo'))" >> $env:GITHUB_ENV
      # 只缓存 crates.io 原始归档；私有源码、编译输出、日志和凭据不进入公开缓存。
      - uses: actions/cache@v5
        with:
          path: ${{ env.CARGO_HOME }}/registry/cache/index.crates.io-*/*.crate
          key: lees-pdf-public-crates-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('private-source/apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            lees-pdf-public-crates-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: 在隔离 runner 从固定来源准备依赖与原生组件
        shell: pwsh
        env:
          SOURCE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
          LEESPDF_DIAGNOSTICS_PUBLIC_KEY: ${{ vars.LEESPDF_DIAGNOSTICS_PUBLIC_KEY }}
        run: '& release-repo/release-tools/lees-pdf/runtime.ps1 -SourceRoot private-source'
      - name: 核对精确 JDK 编译器
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: '& release-repo/release-tools/lees-pdf/prepare-jdk.ps1'
      - name: 构建与核对最终包（私有诊断留在隔离 runner）
        shell: pwsh
        env:
          SOURCE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
          LEESPDF_DIAGNOSTICS_PUBLIC_KEY: ${{ vars.LEESPDF_DIAGNOSTICS_PUBLIC_KEY }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
          LEESPDF_COS_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.LEESPDF_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.LEESPDF_UPDATER_PRIVATE_KEY_PASSWORD }}
          LEESPDF_WINDOWS_PFX: ${{ secrets.LEESPDF_WINDOWS_PFX_BASE64 }}
          LEESPDF_WINDOWS_PFX_PASSWORD: ${{ secrets.LEESPDF_WINDOWS_PFX_PASSWORD }}
        run: |
          & release-repo/release-tools/lees-pdf/build.ps1 -SourceRoot private-source -OutputRoot public-output
      - name: 将公开构建资产上传同一 Draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $assets=@(Get-ChildItem public-output -File | ForEach-Object FullName)
          if(!$assets.Count){throw '公开构建资产缺失'}
          gh release upload $env:PUBLIC_TAG @assets --repo lyq2010/lee-releases --clobber
          if($LASTEXITCODE){throw 'Draft 上传失败'}
  draft:
    if: ${{ !inputs.promote }}
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: lees-pdf-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 读取双端 Draft 资产
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release download "$PUBLIC_TAG" --repo lyq2010/lee-releases --dir public-output
      - name: 核对双端身份，签名发行清单并建立 Draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
          LEESPDF_RELEASE_PRIVATE_KEY: ${{ secrets.LEESPDF_RELEASE_PRIVATE_KEY }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
        run: node release-tools/lees-pdf/manifest.mjs public-output
  mirror:
    if: ${{ always() && !inputs.promote && needs.validate.result == 'success' && needs.draft.result == 'success' }}
    needs: [validate, draft]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: lees-pdf-release
    strategy:
      fail-fast: false
      matrix:
        source: [cos, r2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 下载已签双端 Draft
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release download "$PUBLIC_TAG" --repo lyq2010/lee-releases --dir public-output
      - name: 安装镜像依赖
        run: python3 -m pip install cos-python-sdk-v5==1.9.38
      - name: 一次安装固定版本 R2 上传工具
        if: ${{ matrix.source == 'r2' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/lees-pdf-mirror-tools" --no-audit --no-fund --ignore-scripts wrangler@4.151.0
          echo "LEESPDF_WRANGLER_CLI=$RUNNER_TEMP/lees-pdf-mirror-tools/node_modules/wrangler/bin/wrangler.js" >> "$GITHUB_ENV"
      - name: 上传不可变资产并公网回读
        env:
          MIRROR: ${{ matrix.source }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          R2_BUCKET: packing-list-releases
        run: python3 release-tools/lees-pdf/mirror.py stage public-output
      - name: 上传本轮双源就绪凭据
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release upload "$PUBLIC_TAG" public-output/readiness-${{ matrix.source }}.json --repo lyq2010/lee-releases --clobber
  promote:
    if: ${{ always() && needs.validate.result == 'success' && ((!inputs.promote && needs.mirror.result == 'success') || (inputs.promote && needs.mirror.result == 'skipped')) }}
    needs: [validate, mirror]
    runs-on: ubuntu-latest
    environment: lees-pdf-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 读取同一 Draft
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release download "$PUBLIC_TAG" --repo lyq2010/lee-releases --dir public-output
      - run: python3 -m pip install cos-python-sdk-v5==1.9.38
      - name: 一次安装固定版本 R2 上传工具
        run: |
          npm install --prefix "$RUNNER_TEMP/lees-pdf-mirror-tools" --no-audit --no-fund --ignore-scripts wrangler@4.151.0
          echo "LEESPDF_WRANGLER_CLI=$RUNNER_TEMP/lees-pdf-mirror-tools/node_modules/wrangler/bin/wrangler.js" >> "$GITHUB_ENV"
      - name: 核对双源、晋升更新指针并清理后复核
        env:
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          R2_BUCKET: packing-list-releases
        run: python3 release-tools/lees-pdf/mirror.py release public-output
      - name: 清除 Draft 装配暂存
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          for file in darwin-aarch64.json windows-x86_64.json darwin-aarch64-public-config.json windows-x86_64-public-config.json readiness-cos.json readiness-r2.json; do
            gh release delete-asset "$PUBLIC_TAG" "$file" --repo lyq2010/lee-releases --yes
          done
          gh release view "$PUBLIC_TAG" --repo lyq2010/lee-releases --json assets --jq '.assets[].name | select((startswith("lees-pdf-diagnostics-") and endswith(".json")) or . == "lees-pdf-build-status-windows-x86_64.json")' | while IFS= read -r file; do
            gh release delete-asset "$PUBLIC_TAG" "$file" --repo lyq2010/lee-releases --yes
          done
      - name: 公布发行
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release edit "$PUBLIC_TAG" --repo lyq2010/lee-releases --draft=false --latest=false
