name: Lee's Mail Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Lee's Mail private source tag (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lees-mail-release
  cancel-in-progress: false

jobs:
  build-lees-mail:
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      SOURCE_REPO: lyq2010/lees-mail
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: "1"
      MSBUILDDISABLENODEREUSE: "1"
    outputs:
      public_tag: ${{ steps.tags.outputs.public_tag }}
    steps:
      - name: Resolve and validate tags
        id: tags
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $sourceTag = $env:INPUT_TAG.Trim()
          $publicTag = "lees-mail-$sourceTag"
          if ($sourceTag -notmatch '^v\d+\.\d+\.\d+(\.\d+)?$') { throw "Invalid source tag: $sourceTag" }
          $version = $sourceTag.Substring(1)
          $packageVersion = if ($version.Split('.').Length -eq 3) { "$version.0" } else { $version }
          "source_tag=$sourceTag" >> $env:GITHUB_OUTPUT
          "public_tag=$publicTag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Checkout public release tooling
        uses: actions/checkout@v7
        with:
          path: release-repo
          persist-credentials: false

      - name: Test release tooling
        working-directory: release-repo/release-tools/lees-mail
        shell: pwsh
        run: python -B -m unittest discover -s tests -v

      - name: Create private source read token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: lyq2010
          repositories: lees-mail
          permission-contents: read

      - name: Checkout Lee's Mail source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ steps.tags.outputs.source_tag }}
          path: source
          token: ${{ steps.source-token.outputs.token }}
          fetch-depth: 0

      - name: Verify source tag is reachable from main
        working-directory: source
        shell: pwsh
        env:
          SOURCE_TAG: ${{ steps.tags.outputs.source_tag }}
        run: |
          $tagCommit = (git rev-parse "$env:SOURCE_TAG^{commit}").Trim()
          $checkoutCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $checkoutCommit) {
            throw "Checked-out commit $checkoutCommit does not match source tag commit $tagCommit"
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch source main before validating $env:SOURCE_TAG"
          }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Source tag $env:SOURCE_TAG is not reachable from origin/main"
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore NuGet package cache
        id: nuget-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('source/**/*.csproj', 'source/Directory.Packages.props', 'source/NuGet.Config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        shell: pwsh
        run: npm install --global pnpm@11.9.0

      - name: Prepare Lee's Mail private build
        id: prepare
        shell: pwsh
        env:
          OUTLOOK_CLIENT_ID: ${{ secrets.LEESMAIL_OUTLOOK_CLIENT_ID }}
          GMAIL_CLIENT_ID: ${{ secrets.LEESMAIL_GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.LEESMAIL_GMAIL_CLIENT_SECRET }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
          SIGNING_PFX_BASE64: ${{ secrets.LEESMAIL_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.LEESMAIL_SIGNING_PFX_PASSWORD }}
          PACKAGE_VERSION: ${{ steps.tags.outputs.package_version }}
        run: |
          & release-repo/release-tools/lees-mail/Prepare-Build.ps1 `
            -SourceRoot source `
            -PackageVersion $env:PACKAGE_VERSION

      - name: Restore .NET projects serially
        working-directory: source
        shell: pwsh
        run: |
          function Invoke-RestoreWithRetry([string]$Project, [string[]]$ExtraArgs = @()) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Restoring $Project (attempt $attempt of 3)"
              & dotnet restore $Project --disable-parallel -m:1 -nr:false -p:BuildInParallel=false -p:UseSharedCompilation=false -p:Platform=x64 @ExtraArgs
              if ($LASTEXITCODE -eq 0) { return }
              if ($attempt -lt 3) { Start-Sleep -Seconds (15 * $attempt) }
            }
            throw "Restore failed after 3 attempts: $Project"
          }

          Invoke-RestoreWithRetry 'LeesMail.Core.Tests/LeesMail.Core.Tests.csproj'
          Invoke-RestoreWithRetry 'LeesMail.Mail.ViewModels.Tests/LeesMail.Mail.ViewModels.Tests.csproj'
          $e2eProject = 'tools/LeesMail.LargeAttachments.E2E/LeesMail.LargeAttachments.E2E.csproj'
          if (Test-Path -LiteralPath $e2eProject) {
            Invoke-RestoreWithRetry $e2eProject
          }
          Invoke-RestoreWithRetry 'LeesMail.Mail.WinUI/LeesMail.Mail.WinUI.csproj' @('-p:RuntimeIdentifier=win-x64')

      - name: Save NuGet package cache
        if: steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('source/**/*.csproj', 'source/Directory.Packages.props', 'source/NuGet.Config') }}

      - name: Test Lee's Mail core
        working-directory: source
        shell: pwsh
        run: dotnet test LeesMail.Core.Tests/LeesMail.Core.Tests.csproj -c Release --no-restore -m:1 -nr:false -p:BuildInParallel=false -p:UseSharedCompilation=false -p:Platform=x64 --logger "console;verbosity=minimal"

      - name: Test Lee's Mail view models
        working-directory: source
        shell: pwsh
        run: dotnet test LeesMail.Mail.ViewModels.Tests/LeesMail.Mail.ViewModels.Tests.csproj -c Release --no-restore -m:1 -nr:false -p:BuildInParallel=false -p:UseSharedCompilation=false -p:Platform=x64 --logger "console;verbosity=minimal"

      - name: Build large attachment E2E tool (offline)
        if: ${{ hashFiles('source/tools/LeesMail.LargeAttachments.E2E/LeesMail.LargeAttachments.E2E.csproj') != '' }}
        working-directory: source
        shell: pwsh
        run: dotnet build tools/LeesMail.LargeAttachments.E2E/LeesMail.LargeAttachments.E2E.csproj -c Release --no-restore -m:1 -nr:false -p:BuildInParallel=false -p:UseSharedCompilation=false -p:Platform=x64

      - name: Test large attachment static downloader (offline)
        if: ${{ hashFiles('source/large-attachment-web/package.json') != '' }}
        working-directory: source
        shell: pwsh
        run: npm test --prefix large-attachment-web

      - name: Run Lee's Mail UI quality gates
        working-directory: source
        shell: pwsh
        run: ./scripts/verify-ui-quality.ps1

      - name: Test Cloudflare tracking worker
        working-directory: source/tracking-worker
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          $config = Get-Content -LiteralPath wrangler.jsonc -Raw -Encoding UTF8 | ConvertFrom-Json
          $declaredRequiredSecrets = @($config.secrets.required)
          $expectedSecrets = @('ADMIN_TOKEN', 'TRANSLATION_ACCESS_TOKEN')
          foreach ($secretName in $expectedSecrets) {
            if ($secretName -notin $declaredRequiredSecrets) {
              throw "wrangler.jsonc does not require Worker secret $secretName"
            }
          }
          $liveSecretsJson = pnpm exec wrangler secret list --format json
          if ($LASTEXITCODE -ne 0) { throw "wrangler secret list failed with exit code $LASTEXITCODE" }
          $liveSecrets = @($liveSecretsJson | ConvertFrom-Json)
          $liveSecretNames = @($liveSecrets | ForEach-Object { if ($_.name) { $_.name } else { $_.Name } })
          foreach ($secretName in $expectedSecrets) {
            if ($secretName -notin $liveSecretNames) {
              throw "Deployed Worker is missing required secret $secretName"
            }
          }
          pnpm exec wrangler deploy --dry-run --outdir "$env:RUNNER_TEMP/lees-mail-worker-dry-run"
          if ($LASTEXITCODE -ne 0) { throw "wrangler deploy --dry-run failed with exit code $LASTEXITCODE" }

      - name: Build signed Lee's Mail MSIX
        working-directory: source
        shell: pwsh
        run: ./scripts/build-private-msix.ps1 -NoRestore -AllowUntrustedForVerification -OutputDirectory artifacts/msix

      - name: Verify private configuration is embedded
        working-directory: source
        shell: pwsh
        env:
          GMAIL_CLIENT_ID: ${{ secrets.LEESMAIL_GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.LEESMAIL_GMAIL_CLIENT_SECRET }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
        run: |
          $cosBase = $env:COS_PUBLIC_BASE_URL.Trim().TrimEnd('/')
          if (!$cosBase.Contains('://')) { $cosBase = "https://$cosBase" }
          $expectedManifest = "$cosBase/latest-lees-mail.json"
          $assemblyInfo = @(Get-ChildItem LeesMail.Mail.WinUI/obj/x64/Release -Recurse -File -Filter '*AssemblyInfo.cs')
          if ($assemblyInfo.Count -ne 1) { throw "Expected one generated AssemblyInfo.cs, found $($assemblyInfo.Count)" }
          $generatedSource = Get-Content -LiteralPath $assemblyInfo[0].FullName -Raw -Encoding UTF8
          if (!$generatedSource.Contains($expectedManifest, [StringComparison]::Ordinal)) {
            throw 'Signed build does not contain the configured COS update manifest URL'
          }
          if (!$generatedSource.Contains($env:GMAIL_CLIENT_ID, [StringComparison]::Ordinal)) {
            throw 'Signed build does not contain the configured Google desktop client ID'
          }
          if (!$generatedSource.Contains($env:GMAIL_CLIENT_SECRET, [StringComparison]::Ordinal)) {
            throw 'Signed build does not contain the configured Google desktop client secret'
          }

      - name: Build and verify Lee's Mail setup
        working-directory: source
        shell: pwsh
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          PACKAGE_VERSION: ${{ steps.tags.outputs.package_version }}
          CERTIFICATE_THUMBPRINT: ${{ steps.prepare.outputs.thumbprint }}
        run: |
          & ../release-repo/release-tools/lees-mail/Build-AndVerifyInstaller.ps1 `
            -SourceRoot . `
            -MsixDirectory artifacts/msix `
            -OutputDirectory artifacts/installer `
            -InstallerDefinition ../release-repo/release-tools/lees-mail-installer/LeesMailInstaller.iss `
            -InstallScript ../release-repo/release-tools/lees-mail-installer/InstallLeesMail.ps1 `
            -Version $env:VERSION `
            -PackageVersion $env:PACKAGE_VERSION `
            -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT

      - name: Stage and verify release files
        working-directory: source
        shell: pwsh
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          SOURCE_TAG: ${{ steps.tags.outputs.source_tag }}
          PUBLIC_TAG: ${{ steps.tags.outputs.public_tag }}
          CERTIFICATE_THUMBPRINT: ${{ steps.prepare.outputs.thumbprint }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          & ../release-repo/release-tools/lees-mail/Stage-Release.ps1 `
            -SourceRoot . `
            -MsixDirectory artifacts/msix `
            -InstallerDirectory artifacts/installer `
            -StageDirectory release-stage `
            -NotesPath artifacts/release-notes.md `
            -Version $env:VERSION `
            -SourceTag $env:SOURCE_TAG `
            -PublicTag $env:PUBLIC_TAG `
            -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT `
            -Repository $env:RELEASE_REPOSITORY

      - name: Publish Lee's Mail Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tags.outputs.public_tag }}
          name: Lee's Mail for Windows ${{ steps.tags.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          files: source/release-stage/*
          body_path: source/artifacts/release-notes.md

      - name: Clean private build material
        if: always()
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.prepare.outputs.thumbprint }}
        run: |
          if ($env:CERTIFICATE_THUMBPRINT -and (Test-Path "Cert:\CurrentUser\My\$env:CERTIFICATE_THUMBPRINT")) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:CERTIFICATE_THUMBPRINT" -Force
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'lees-mail-signing.pfx'
          if (Test-Path -LiteralPath $pfxPath) {
            Remove-Item -LiteralPath $pfxPath -Force
          }
          if (Test-Path -LiteralPath source/LeesMail.Private.props) {
            Remove-Item -LiteralPath source/LeesMail.Private.props -Force
          }
          Get-AppxPackage -Name LeesMail | Remove-AppxPackage -ErrorAction SilentlyContinue
          if ($env:CERTIFICATE_THUMBPRINT -and (Test-Path "Cert:\LocalMachine\TrustedPeople\$env:CERTIFICATE_THUMBPRINT")) {
            Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$env:CERTIFICATE_THUMBPRINT" -Force
          }

  cos-lees-mail-mirror:
    needs: build-lees-mail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          path: release-repo
          persist-credentials: false

      - name: Download Lee's Mail Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.build-lees-mail.outputs.public_tag }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$PUBLIC_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          test -s assets/latest-lees-mail.json

      - name: Install Tencent COS client
        run: python3 -m pip install --user cos-python-sdk-v5

      - name: Mirror Lee's Mail release to COS
        env:
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        run: python3 release-repo/release-tools/lees-mail/mirror_release.py cos

  r2-lees-mail-mirror:
    needs: build-lees-mail
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: packing-list-releases
      R2_PUBLIC_BASE_URL: https://plt-releases.leenbsl.workers.dev
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          path: release-repo
          persist-credentials: false

      - name: Download Lee's Mail Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.build-lees-mail.outputs.public_tag }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$PUBLIC_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          test -s assets/latest-lees-mail.json

      - name: Mirror Lee's Mail release to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 release-repo/release-tools/lees-mail/mirror_release.py r2
