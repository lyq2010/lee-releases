name: Lee PDF temporary packaging diagnosis
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 私有源码 Tag（例如 v1.0.0）
        required: true
        type: string
      runtime_tag:
        description: 私有仓中已核对的双平台运行时发行 Tag
        required: true
        type: string
      platform:
        description: 构建平台；单端重试复用同一 Draft 已核对的另一端资产
        type: choice
        default: all
        options: [all, windows-x86_64, darwin-aarch64]
      promote:
        description: 晋升已有 Draft（双源资产与更新指针回读；最终包由用户验收）
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lees-pdf-diagnosis
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - id: version
        env:
          SOURCE_TAG: ${{ inputs.tag }}
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import os,re,json
          tag=os.environ['SOURCE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)',tag):
              raise SystemExit('源码 Tag 格式无效')
          platform=os.environ.get('BUILD_PLATFORM') or 'all'
          rows=[{'target':'windows-x86_64','runner':'windows-2025','runtime_hash_var':'LEESPDF_RUNTIME_WINDOWS_SHA256'}, {'target':'darwin-aarch64','runner':'macos-26','runtime_hash_var':'LEESPDF_RUNTIME_MACOS_SHA256'}]
          if platform not in ('all','windows-x86_64','darwin-aarch64'):
              raise SystemExit('构建平台无效')
          if platform != 'all':
              rows=[row for row in rows if row['target']==platform]
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'version={tag[1:]}\ntag=lees-pdf-{tag}\n')
              output.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          PY
  prepare-draft:
    if: ${{ !inputs.promote }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 准备公开资产暂存 Draft
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$PUBLIC_TAG" --repo lyq2010/lee-releases --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$PUBLIC_TAG" --repo lyq2010/lee-releases --json isDraft --jq .isDraft)" = true
          else
            gh release create "$PUBLIC_TAG" --repo lyq2010/lee-releases --target main --draft --latest=false --title "Lee’s PDF $RELEASE_VERSION" --notes "双平台发行资产准备中；尚未公布。"
          fi
  build:
    if: ${{ !inputs.promote }}
    needs: [validate, prepare-draft]
    permissions:
      contents: write
    # 一次性 GitHub 托管 runner；私有源码和诊断不进入公开缓存或资产。
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    environment: lees-pdf-release
    steps:
      - uses: actions/checkout@v7
        with:
          path: release-repo
          persist-credentials: false
      - name: 创建仅限 PDF 私有仓的只读令牌
        id: source
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: lyq2010
          repositories: lees-pdf
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: lyq2010/lees-pdf
          ref: ${{ inputs.tag }}
          path: private-source
          token: ${{ steps.source.outputs.token }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: 准备已固定哈希的私有运行时
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.source.outputs.token }}
          RUNTIME_TAG: ${{ inputs.runtime_tag }}
          RUNTIME_SHA256: ${{ vars[matrix.runtime_hash_var] }}
          RELEASE_TARGET: ${{ matrix.target }}
          RUNTIME_SOURCES_SHA256: ${{ vars.LEESPDF_RUNTIME_WINDOWS_SOURCES_SHA256 }}
        run: '& release-repo/release-tools/lees-pdf/runtime.ps1'
      - name: 准备精确 JDK 编译器
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: '& release-repo/release-tools/lees-pdf/prepare-jdk.ps1'
      - name: 构建与核对最终包（私有诊断留在隔离 runner）
        shell: pwsh
        env:
          SOURCE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
          LEESPDF_DIAGNOSTICS_PUBLIC_KEY: ${{ vars.LEESPDF_DIAGNOSTICS_PUBLIC_KEY }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
          LEESPDF_COS_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.LEESPDF_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.LEESPDF_UPDATER_PRIVATE_KEY_PASSWORD }}
          LEESPDF_WINDOWS_PFX: ${{ secrets.LEESPDF_WINDOWS_PFX_BASE64 }}
          LEESPDF_WINDOWS_PFX_PASSWORD: ${{ secrets.LEESPDF_WINDOWS_PFX_PASSWORD }}
        run: |
          & release-repo/release-tools/lees-pdf/build.ps1 -SourceRoot private-source -OutputRoot public-output
      - name: 将公开构建资产上传同一 Draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $assets=@(Get-ChildItem public-output -File | ForEach-Object FullName)
          if(!$assets.Count){throw '公开构建资产缺失'}
          gh release upload $env:PUBLIC_TAG @assets --repo lyq2010/lee-releases --clobber
          if($LASTEXITCODE){throw 'Draft 上传失败'}
