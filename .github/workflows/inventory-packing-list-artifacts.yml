name: Remove Packing List Public Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge-cos:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact matching COS objects
        env:
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        run: |
          set -euo pipefail
          python3 -m pip install --user cos-python-sdk-v5
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          from qcloud_cos import CosConfig, CosS3Client

          base = os.environ["COS_PUBLIC_BASE_URL"].strip().rstrip("/")
          if "://" not in base:
              base = f"https://{base}"
          parsed = urlparse(base)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("COS_PUBLIC_BASE_URL is invalid")
          path_prefix = parsed.path.strip("/")
          key = lambda name: f"{path_prefix}/{name}" if path_prefix else name
          client = CosS3Client(CosConfig(
              Region=os.environ["TENCENT_COS_REGION"].strip(),
              SecretId=os.environ["TENCENT_COS_SECRET_ID"].strip(),
              SecretKey=os.environ["TENCENT_COS_SECRET_KEY"].strip(),
              Scheme="https",
          ))
          bucket = os.environ["TENCENT_COS_BUCKET"].strip()

          def list_keys(prefix):
              marker = ""
              found = []
              while True:
                  args = {"Bucket": bucket, "Prefix": prefix, "MaxKeys": 1000}
                  if marker:
                      args["Marker"] = marker
                  page = client.list_objects(**args)
                  found.extend(obj["Key"] for obj in page.get("Contents", []) or [])
                  if page.get("IsTruncated") not in ("true", True):
                      return found
                  marker = page.get("NextMarker") or ""
                  if not marker:
                      raise SystemExit("COS listing was truncated without a marker")

          targets = list_keys(key("packing-list-toolkit_"))
          latest = key("latest.json")
          if latest in list_keys(latest):
              targets.append(latest)
          expected = {
              key("latest.json"),
              key("packing-list-toolkit_2.5.1_aarch64.app.tar.gz"),
              key("packing-list-toolkit_2.5.1_aarch64.app.tar.gz.sig"),
              key("packing-list-toolkit_2.5.1_arm64.dmg"),
              key("packing-list-toolkit_2.5.1_x64-setup.exe"),
          }
          if set(targets) != expected:
              raise SystemExit(f"COS target set changed; refusing deletion: {sorted(set(targets))}")
          for target in sorted(expected):
              client.delete_object(Bucket=bucket, Key=target)
              print(f"Deleted COS object: {target}")
          remaining = set(list_keys(key("packing-list-toolkit_")))
          if latest in list_keys(latest):
              remaining.add(latest)
          if remaining:
              raise SystemExit(f"COS cleanup incomplete: {sorted(remaining)}")
          print("COS cleanup verified: 5 objects deleted")
          PY

  purge-r2:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: packing-list-releases
    steps:
      - name: Delete exact matching R2 objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          bucket = os.environ["R2_BUCKET"].strip()

          def api(path, params=None, method="GET"):
              url = f"https://api.cloudflare.com/client/v4{path}"
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, method=method, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.loads(response.read().decode("utf-8"))
              if not data.get("success"):
                  raise SystemExit(json.dumps(data, ensure_ascii=False))
              return data

          accounts = api("/accounts").get("result") or []
          if len(accounts) != 1:
              raise SystemExit(f"Expected exactly one Cloudflare account, got {len(accounts)}")
          account_id = accounts[0]["id"]
          account_name = accounts[0].get("name", "")
          if account_id != "ddc02ab00dd3754d95fa60562a5ec351":
              raise SystemExit(f"Unexpected Cloudflare account: {account_id}")
          bucket_path = f"/accounts/{urllib.parse.quote(account_id, safe='')}/r2/buckets/{urllib.parse.quote(bucket, safe='')}/objects"

          def list_keys(prefix):
              cursor = ""
              found = []
              while True:
                  params = {"prefix": prefix, "per_page": "1000"}
                  if cursor:
                      params["cursor"] = cursor
                  page = api(bucket_path, params)
                  found.extend(obj["key"] for obj in page.get("result") or [])
                  info = page.get("result_info") or {}
                  if not info.get("is_truncated"):
                      return found
                  cursor = info.get("cursor") or ""
                  if not cursor:
                      raise SystemExit("R2 listing was truncated without a cursor")

          targets = list_keys("packing-list-toolkit_")
          if "latest.json" in list_keys("latest.json"):
              targets.append("latest.json")
          expected = {
              "latest.json",
              "packing-list-toolkit_2.5.1_aarch64.app.tar.gz",
              "packing-list-toolkit_2.5.1_aarch64.app.tar.gz.sig",
              "packing-list-toolkit_2.5.1_arm64.dmg",
              "packing-list-toolkit_2.5.1_x64-setup.exe",
          }
          if set(targets) != expected:
              raise SystemExit(f"R2 target set changed; refusing deletion: {sorted(set(targets))}")
          for target in sorted(expected):
              path = f"{bucket_path}/{urllib.parse.quote(target, safe='/')}"
              api(path, method="DELETE")
              print(f"Deleted R2 object: {target}")
          remaining = set(list_keys("packing-list-toolkit_"))
          if "latest.json" in list_keys("latest.json"):
              remaining.add("latest.json")
          if remaining:
              raise SystemExit(f"R2 cleanup incomplete: {sorted(remaining)}")
          print(f"R2 cleanup verified for {account_name}: 5 objects deleted")
          PY
