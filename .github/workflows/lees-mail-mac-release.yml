name: Lee's Mail Mac Release

# 私有源码仓 lyq2010/lees-mail-mac 打 tag 后在这里发版。
# 更新通道沿用 native-release.yml 的双通道做法：COS 为主、R2 为备，
# 两条通道各放一份 latest-lees-mail-electron.json，客户端按顺序失败切换。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "私有源码仓 tag（如 v0.1.0）"
        required: true
        type: string
      publish:
        description: '发布到 COS / R2 更新通道'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: lees-mail-mac-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  SOURCE_REPO: lyq2010/lees-mail-mac
  MANIFEST_NAME: latest-lees-mail-electron.json
  # 与 native-release.yml 相同的备用通道，非 secret。
  R2_BUCKET: packing-list-releases
  R2_PUBLIC_BASE_URL: https://plt-releases.leenbsl.workers.dev

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tags.outputs.version }}
      public_tag: ${{ steps.tags.outputs.public_tag }}
    steps:
      - name: Resolve tags
        id: tags
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          source_tag="${RAW_TAG}"
          [[ "$source_tag" == v* ]] || source_tag="v${source_tag}"
          version="${source_tag#v}"
          # 版本号参与 Info.plist 与包内 package.json，必须是纯 x.y.z。
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "版本号必须形如 0.1.0，收到：$version" >&2
            exit 1
          }
          echo "source_tag=$source_tag" | tee -a "$GITHUB_OUTPUT"
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
          echo "public_tag=lees-mail-mac-v$version" | tee -a "$GITHUB_OUTPUT"

      - name: Create private source read token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: lyq2010
          repositories: lees-mail-mac
          permission-contents: read

      - name: Checkout Lee's Mail Mac source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ steps.tags.outputs.source_tag }}
          path: source
          token: ${{ steps.source-token.outputs.token }}
          submodules: false

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install dependencies
        working-directory: source
        run: npm ci

      # npm run build 只打包已存在的 app/mailsync，不会编译它。
      #
      # libetpan-prepare 是个纯 script target（把 autogen-result.tar.gz 解开成 header
      # farm）。让它跟 mailsync 在同一次并行构建里跑，Xcode 会报
      # "Internal inconsistency error: never received target ended message"。
      # 本地不会复现，因为 header farm 早已存在、该 target 是空转；干净环境才暴露。
      # 所以先单独把它跑完，再串行构建 mailsync。
      - name: Prepare libetpan headers
        working-directory: source/mailsync
        run: |
          set -euo pipefail
          xcodebuild -project MailSync.xcodeproj -scheme libetpan-prepare \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/mailsync-derived" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO -jobs 1 build
          test -d Vendor/libetpan/include/libetpan

      - name: Build mailsync (arm64)
        working-directory: source/mailsync
        run: |
          set -euo pipefail
          xcodebuild -project MailSync.xcodeproj -scheme mailsync \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/mailsync-derived" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO -jobs 1 build
          test -x ../app/mailsync
          file ../app/mailsync | grep -q arm64

      - name: Build app, DMG and ZIP
        working-directory: source
        env:
          LEES_MAIL_VERSION: ${{ steps.tags.outputs.version }}
          LEES_MAIL_GOOGLE_CLIENT_ID: ${{ secrets.LEESMAIL_GMAIL_CLIENT_ID }}
          LEES_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.LEESMAIL_GMAIL_CLIENT_SECRET }}
          LEES_MAIL_MICROSOFT_CLIENT_ID: ${{ secrets.LEESMAIL_OUTLOOK_CLIENT_ID }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          cos_base="${COS_PUBLIC_BASE_URL%/}"
          [[ "$cos_base" == https://* ]] || cos_base="https://${cos_base#*://}"
          # 清单文件名固定，所以构建阶段就能拼出两条通道的地址，不必等上传完成。
          export LEES_MAIL_UPDATE_MANIFEST_URLS="${cos_base}/${MANIFEST_NAME},${R2_PUBLIC_BASE_URL}/${MANIFEST_NAME}"
          echo "更新通道：${LEES_MAIL_UPDATE_MANIFEST_URLS}"
          npm run build
          test -f app/dist/LeesMail.dmg
          test -f app/dist/LeesMail.zip

      - name: Create GPL corresponding source archive
        working-directory: source
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          archive="app/dist/LeesMail-${VERSION}-source.tar.gz"
          git archive --format=tar.gz \
            --prefix="LeesMail-${VERSION}-source/" \
            --output="$archive" \
            HEAD -- . ':(exclude).snapcraft/credentials.enc'
          test -s "$archive"
          tar -tzf "$archive" | grep -q "LeesMail-${VERSION}-source/LICENSE.md"
          tar -tzf "$archive" | grep -q "LeesMail-${VERSION}-source/UPSTREAM.md"
          tar -tzf "$archive" | grep -q "LeesMail-${VERSION}-source/mailsync/"

      - name: Sign DMG with minisign
        working-directory: source
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.LEESMAIL_MAC_MINISIGN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "缺少 LEESMAIL_MAC_MINISIGN_KEY，无法为更新通道签名。" >&2
            exit 1
          fi
          # runner 镜像预置的 aws/tap 未受 Homebrew 新的 tap 信任策略认可，
          # 每条 brew 命令都会为它打印一段警告。本 job 不使用 aws CLI。
          brew untap aws/tap >/dev/null 2>&1 || true
          brew list minisign >/dev/null 2>&1 || brew install minisign
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          chmod 600 "$key"
          # 私钥无密码，仍需喂一个空行给 minisign 的密码提示。
          # -H 生成预哈希签名，与客户端的验证方式一致。
          printf '\n' | minisign -S -H -s "$key" -m app/dist/LeesMail.dmg
          rm -f "$key"
          test -f app/dist/LeesMail.dmg.minisig

      - name: Verify release artifacts
        working-directory: source
        run: |
          set -euo pipefail
          # 该门禁要求至少两个不同的无凭据 HTTPS 清单地址，正好对应主备双通道。
          npm run test:release -- \
            --version "${{ steps.tags.outputs.version }}" \
            --expect-update-config \
            --source "app/dist/LeesMail-${{ steps.tags.outputs.version }}-source.tar.gz"

      - name: Create update manifest
        working-directory: source
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          PUBLIC_TAG: ${{ steps.tags.outputs.public_tag }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          cos_base="${COS_PUBLIC_BASE_URL%/}"
          [[ "$cos_base" == https://* ]] || cos_base="https://${cos_base#*://}"
          dmg_name="LeesMail-${VERSION}-arm64.dmg"
          # 清单记录的是下载地址与 SHA-256，与本地文件名无关，所以先按原名生成清单、
          # 再改名。反过来会让上一步的发行物门禁找不到 LeesMail.dmg。
          node scripts/release/create-update-manifest.js \
            --version "$VERSION" \
            --dmg app/dist/LeesMail.dmg \
            --download-url "${cos_base}/${dmg_name}" \
            --output "app/dist/${MANIFEST_NAME}"
          test -s "app/dist/${MANIFEST_NAME}"
          cat "app/dist/${MANIFEST_NAME}"
          # 改成带版本号的名字，作为 Release 资产与两条通道上的对象名。
          mv app/dist/LeesMail.dmg "app/dist/${dmg_name}"
          mv app/dist/LeesMail.dmg.minisig "app/dist/${dmg_name}.minisig"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ steps.tags.outputs.public_tag }}
          VERSION: ${{ steps.tags.outputs.version }}
        working-directory: source
        run: |
          set -euo pipefail
          gh release delete "$PUBLIC_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$PUBLIC_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lee's Mail for Mac $VERSION" \
            --notes "Lee's Mail for macOS (Apple Silicon) $VERSION" \
            --latest=false \
            "app/dist/LeesMail-${VERSION}-arm64.dmg" \
            "app/dist/LeesMail-${VERSION}-arm64.dmg.minisig" \
            "app/dist/${MANIFEST_NAME}" \
            "app/dist/LeesMail.zip" \
            "app/dist/LeesMail-${VERSION}-source.tar.gz"

  cos-lees-mail-mac-mirror:
    needs: build
    if: ${{ needs.build.result == 'success' && inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.build.outputs.public_tag }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$PUBLIC_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          test -s "assets/${MANIFEST_NAME}"

      - name: Mirror to COS (primary channel)
        env:
          VERSION: ${{ needs.build.outputs.version }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        run: |
          set -euo pipefail
          python3 -m pip install --user cos-python-sdk-v5
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          from urllib.parse import urlparse
          from qcloud_cos import CosConfig, CosS3Client

          base = os.environ["COS_PUBLIC_BASE_URL"].strip().rstrip("/")
          if "://" not in base:
              base = f"https://{base}"
          parsed = urlparse(base)
          if parsed.scheme != "https" or not parsed.netloc:
              sys.exit(f"COS_PUBLIC_BASE_URL 无效: {base}")
          prefix = parsed.path.strip("/")
          key = lambda name: f"{prefix}/{name}" if prefix else name

          client = CosS3Client(CosConfig(
              Region=os.environ["TENCENT_COS_REGION"].strip(),
              SecretId=os.environ["TENCENT_COS_SECRET_ID"].strip(),
              SecretKey=os.environ["TENCENT_COS_SECRET_KEY"].strip(),
              Scheme="https",
          ))
          bucket = os.environ["TENCENT_COS_BUCKET"].strip()
          version = os.environ["VERSION"]
          manifest = os.environ.get("MANIFEST_NAME", "latest-lees-mail-electron.json")

          for name, ctype in (
              (f"LeesMail-{version}-arm64.dmg", "application/x-apple-diskimage"),
              (f"LeesMail-{version}-arm64.dmg.minisig", "text/plain; charset=utf-8"),
          ):
              path = Path("assets") / name
              if not path.is_file():
                  sys.exit(f"缺少发行物: {path}")
              client.upload_file(Bucket=bucket, LocalFilePath=str(path), Key=key(name), EnableMD5=False)

          # 清单最后传：它一旦就位，客户端就会开始下载对应的 DMG。
          client.put_object(
              Bucket=bucket,
              Body=(Path("assets") / manifest).read_bytes(),
              Key=key(manifest),
              ContentType="application/json; charset=utf-8",
          )

          # 清理旧版本产物。
          #
          # 这个桶是共用的，里面还有 Windows 版 Lee's Mail（LeesMail_1.0.0_x64.msix、
          # LeesMail_1.0.0_x64-setup.exe，用下划线）和 Lee's Toolbox。只靠前缀区分
          # 太脆弱——LeesMail- 与 LeesMail_ 只差一个字符。所以按完整正则匹配本项目
          # 自己的命名，其余一概不碰。
          import re
          pattern = re.compile(r"^LeesMail-\d+\.\d+\.\d+-arm64\.dmg(\.minisig)?$")
          keep = {f"LeesMail-{version}-arm64.dmg", f"LeesMail-{version}-arm64.dmg.minisig"}
          marker = ""
          while True:
              kwargs = {"Bucket": bucket, "Prefix": key("LeesMail-"), "MaxKeys": 1000}
              if marker:
                  kwargs["Marker"] = marker
              listed = client.list_objects(**kwargs)
              for obj in listed.get("Contents", []) or []:
                  obj_key = obj.get("Key", "")
                  name = obj_key[len(prefix) + 1:] if prefix else obj_key
                  if not pattern.match(name) or name in keep:
                      continue
                  client.delete_object(Bucket=bucket, Key=obj_key)
                  print(f"已删除旧产物: {obj_key}")
              if listed.get("IsTruncated") in ("true", True):
                  marker = listed.get("NextMarker") or ""
                  if marker:
                      continue
              break
          print("COS 主通道已更新")
          PY

      - name: Verify COS serves the new version
        env:
          VERSION: ${{ needs.build.outputs.version }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          cos_base="${COS_PUBLIC_BASE_URL%/}"
          [[ "$cos_base" == https://* ]] || cos_base="https://${cos_base#*://}"
          got="$(curl -fsS -H 'Cache-Control: no-cache' \
            "${cos_base}/${MANIFEST_NAME}?verify=${GITHUB_RUN_ID}" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          [ "$got" = "$VERSION" ] || { echo "$cos_base 返回 $got，期望 $VERSION" >&2; exit 1; }
          echo "COS 主通道就绪：$got"

  r2-lees-mail-mac-mirror:
    needs: build
    if: ${{ needs.build.result == 'success' && inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TAG: ${{ needs.build.outputs.public_tag }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$PUBLIC_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          test -s "assets/${MANIFEST_NAME}"

      - name: Mirror to R2 (fallback channel)
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          account_id="$(
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              https://api.cloudflare.com/client/v4/accounts |
            python3 -c 'import json,sys; d=json.load(sys.stdin); a=d.get("result") or []; assert d.get("success") and a; print(a[0]["id"])'
          )"
          export CLOUDFLARE_ACCOUNT_ID="$account_id"
          dmg="LeesMail-${VERSION}-arm64.dmg"

          # R2 上的清单必须指向 R2 自己的 DMG 与签名。客户端会依次尝试两条清单地址，
          # 但下载只认它拿到的那份清单里的 downloadURL，没有跨通道回退；若两份清单都写
          # COS，COS 挂掉时客户端能从 R2 发现新版本，下载仍会回到 COS 而失败。
          # sha256 与 downloadSize 描述的是同一个文件，保持不变。
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          base = os.environ["R2_PUBLIC_BASE_URL"].strip().rstrip("/")
          dmg = f"LeesMail-{os.environ['VERSION']}-arm64.dmg"
          path = Path("assets") / os.environ["MANIFEST_NAME"]
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["downloadURL"] = f"{base}/{dmg}"
          manifest["minisignSignatureURL"] = f"{base}/{dmg}.minisig"
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

          npm exec --yes --package wrangler@4 -- wrangler r2 object put \
            "${R2_BUCKET}/${dmg}" --file "assets/${dmg}" --remote
          npm exec --yes --package wrangler@4 -- wrangler r2 object put \
            "${R2_BUCKET}/${dmg}.minisig" --file "assets/${dmg}.minisig" --remote
          npm exec --yes --package wrangler@4 -- wrangler r2 object put \
            "${R2_BUCKET}/${MANIFEST_NAME}" --file "assets/${MANIFEST_NAME}" \
            --content-type "application/json; charset=utf-8" --remote

          # 清理旧版本产物。这个桶与 Lee's Toolbox Mac 共用，所以前缀严格限定为
          # LeesMail-，且只删 .dmg / .dmg.minisig，不碰清单和别的项目的对象。
          python3 - "$account_id" <<'PY'
          import json, os, re, sys, urllib.parse, urllib.request

          account_id = sys.argv[1]
          bucket = os.environ["R2_BUCKET"].strip()
          token = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          version = os.environ["VERSION"]
          # 完整正则，不是前缀匹配：同桶里还有 Windows 版 Lee's Mail（LeesMail_…_x64.msix
          # / -setup.exe）和 Lee's Toolbox，只差一个字符的前缀不足以安全区分。
          pattern = re.compile(r"^LeesMail-\d+\.\d+\.\d+-arm64\.dmg(\.minisig)?$")
          keep = {f"LeesMail-{version}-arm64.dmg", f"LeesMail-{version}-arm64.dmg.minisig"}

          def api(method, path, params=None):
              url = f"https://api.cloudflare.com/client/v4{path}"
              if params:
                  url = f"{url}?{urllib.parse.urlencode(params)}"
              req = urllib.request.Request(url, method=method,
                                           headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.loads(response.read().decode("utf-8"))
              if not data.get("success"):
                  raise SystemExit(json.dumps(data, ensure_ascii=False))
              return data

          base = (f"/accounts/{urllib.parse.quote(account_id, safe='')}"
                  f"/r2/buckets/{urllib.parse.quote(bucket, safe='')}/objects")
          stale, cursor = [], ""
          while True:
              params = {"prefix": "LeesMail-", "per_page": "1000"}
              if cursor:
                  params["cursor"] = cursor
              data = api("GET", base, params)
              for obj in data.get("result") or []:
                  name = obj.get("key", "")
                  if pattern.match(name) and name not in keep:
                      stale.append(name)
              info = data.get("result_info") or {}
              cursor = info.get("cursor") or ""
              if not cursor:
                  break

          for name in stale:
              api("DELETE", f"{base}/{urllib.parse.quote(name, safe='')}")
              print(f"已删除旧产物: {name}")
          PY
          echo "R2 备用通道已更新"

      - name: Verify R2 serves the new version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache' \
            "${R2_PUBLIC_BASE_URL}/${MANIFEST_NAME}?verify=${GITHUB_RUN_ID}" \
            -o r2-manifest.json
          # 备用通道要能独立完成一次升级：版本对得上，且清单里的下载地址落在 R2 自己身上。
          python3 - "$VERSION" "$R2_PUBLIC_BASE_URL" r2-manifest.json <<'PY'
          import json, sys

          version, base, path = sys.argv[1], sys.argv[2].strip().rstrip("/"), sys.argv[3]
          with open(path, encoding="utf-8") as handle:
              manifest = json.load(handle)
          if manifest["version"] != version:
              sys.exit(f"R2 返回 {manifest['version']}，期望 {version}")
          for field in ("downloadURL", "minisignSignatureURL"):
              if not manifest[field].startswith(f"{base}/"):
                  sys.exit(f"R2 清单的 {field} 仍指向 {manifest[field]}，备用通道无法独立下载。")
          print(manifest["downloadURL"])
          PY
          # 顺带确认签名文件真的能从 R2 取到（几百字节，不必拉整个 DMG）。
          sig_url="$(python3 -c 'import json;print(json.load(open("r2-manifest.json"))["minisignSignatureURL"])')"
          curl -fsS -o /dev/null "$sig_url"
          echo "R2 备用通道就绪：$VERSION"
